scene_sampling:  # env: simfoundry -- Sample pose variants from a pre-built asset scene JSON (feeds into step 14 load_sampling)
  input_scene_json: null        # Required: path to source scene JSON (absolute or relative to repo root)
                                # Output is always saved to <scene_asset_dir>/sampling_scene/ (derived from input path)
                                # Step 14: set scene_json_name=<name> + s14_teleop.scene_source=load_sampling
  n_iterations: 10              # Number of randomized scenes to generate
  xy_range: 0.03                # Max XY displacement per group (meters)
  z_rotation_deg: 50            # Z rotation range: 360 = full [0,360°), else ±N degrees
  settle_steps: 500             # Physics steps to settle after each randomization
  n_calibration_trials: 3       # Trials to determine stable original on_top relationships
  camera_pos: [-0.0466, -0.7612, 0.5355]         # Viewer camera position for scene images
  camera_ori: [0.5219, -0.0213, -0.0347, 0.8521] # Viewer camera orientation (xyzw quaternion)

