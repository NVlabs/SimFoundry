defaults:
  - _self_  # all below configs will override this conf.yaml
#  - arch: ???
  - task: load_scene
#  - robot: ???
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: custom

# ===== main cfg =====
root_dir: ../../Data # Where you want to save the data, can be absolute or relative to this config file
scene_name: example_scene 
seed: 0
visualize: false
debug: false
gcloud_project: ${oc.env:GCLOUD_PROJECT,null} # Google Cloud project id (required — Vertex AI backs all remote VLM stages). Reads $GCLOUD_PROJECT; replace with a literal id to hardcode it.
rerun_all: true
low_vram: false

# ===== model init cfgs =====
model:
  hunyuan:
    init_kwargs:


# ===== per-step cfg =====
s1_zed:     # env: zed
  rerun: true  # Set to true to rerun the step, false to skip
  out_dirname: s1_zed
  out_dir: "${root_dir}/${scene_name}/${s1_zed.out_dirname}"
  n_images: 5
  n_sec_between_images: 3
  use_pygame_countdown: false   # Set to true for visual pygame countdown, false for terminal countdown
  show_video_stream: true       # Set to true to show live camera feed during capture, false to disable
s1_video:     # env: simfoundry
  rerun: true  # Set to true to rerun the step, false to skip
  single_image_input: false
  out_dirname: s1_video
  out_dir: "${root_dir}/${scene_name}/${s1_video.out_dirname}"
  video_fpath: "${root_dir}/Scene_Video/${scene_name}.MOV"
  n_subsampled_frames: 15
  # splat-prep mode: when true, emit splat-ready frames into s1_video so stage 2b
  # (orig-DA3), stages 3-14, AND the auto_bg VOID stage all read ONE frame set:
  #   frames_subsampled_<N>/frame_<i:04d>.png (resized to target_w x target_h)
  #   + input_video.mp4 + frame_index_map.json
  # (vs the default objects-only layout: frames_all/ + source-res frames_subsampled_<N>/).
  # The canonical reconstruction is run in this mode (n=400, 672x384) before the
  # background-only auto_bg add-on (scripts/.../auto_bg_reconstruction/run_auto_align.sh).
  splat_prep: false
  mp4_fps: 12       # splat_prep: fps of the reassembled input_video.mp4 (must match void_mp4_fps)
  target_w: null    # splat_prep: resize width  (null -> source width);  VOID/splat uses 672
  target_h: null    # splat_prep: resize height (null -> source height); VOID/splat uses 384
s2_fs:      # env: fs
  rerun: true
  out_dirname: s2_fs
  out_dir: "${root_dir}/${scene_name}/${s2_fs.out_dirname}"
  resolution: 1008
  fs:
    scale: 0.5
    hiera: 0
    z_far: 2
    valid_iters: 32
    get_pc: 1
    remove_invisible: 1
    denoise_cloud: 1
    denoise_nb_points: 30
    denoise_radius: 0.03
s2_da:      # env: da3
  rerun: true
  out_dirname: s2_da
  out_dir: "${root_dir}/${scene_name}/${s2_da.out_dirname}"
  resolution: 448    # Must be multiple of 14 (chunked-VRAM-safe @ 220-frame chunks on 24 GB)
  frames_dir: null   # null -> ${s1_video.out_dir}/frames_subsampled_<n>; override to run DA3 on another frames dir (e.g. void cleaned_frames)
  # Long-sequence chunking: chunk only when N > chunk_threshold, then Sim(3)-merge
  # per-chunk runs into one world. N<=threshold (e.g. the 15-frame main pipeline) stays single-pass.
  chunk_threshold: 220
  chunk_size: 220    # VAE/attention buffer fits ~220 frames @ res 448 on 24 GB
  overlap: 40        # frames shared between adjacent chunks for the Sim(3) merge
  rerun_chunks: false
  heavy_exports: false  # mesh/gs/colmap exports (not consumed downstream)
s2_depth:    # unified stage-2 backend selector (used by 2_run_depth.py)
  backend: da3   # options: da3, fs
s2c_gs:  # env: nerfstudio_simfoundry; process video with ns-process-data and train splatfacto-big
  out_dirname: s2c_gs
  out_dir: "${root_dir}/${scene_name}/${s2c_gs.out_dirname}"
  # Inherit the same source video as stage 1b so a single --video-fpath (which sets
  # s1_video.video_fpath) drives both stages. Override explicitly to use a different
  # video for the 2c bg-splat. (Previously hard-coded to Scene_Video/<scene>.MOV, which
  # didn't follow --video-fpath and 404'd.)
  video_fpath: "${s1_video.video_fpath}"
  processed_dirname: processed
  export_dirname: export
  num_frames_target: 1000  # frames to extract (nerfstudio default 300); more = denser, slower COLMAP
  matching_method: vocab_tree  # sequential often registers only a few frames; vocab_tree gets many more poses
  max_num_iterations: 50000 # default is 30000
  # method: splatfacto-big # change to splatfacto if overload
  method: splatfacto
s3_ground:    # env: simfoundry
  rerun: true
  out_dirname: s3_ground
  out_dir: "${root_dir}/${scene_name}/${s3_ground.out_dirname}"
  floor_categories: [desk, table, counter]
  floor_threshold: 0.5
  floor_tilt_threshold: 0.125
  # The canonical frame the whole reconstruction is built from: stage 3 fits the support plane
  # in it, stage 4 makes its camera the world frame, and stage 5 crops every object out of it.
  # `auto` lets stage 3 score the candidates (see frame_selection below); an integer pins a
  # frame, which is what the pipeline used to do unconditionally. Stage 3 records the resolved
  # index in s3_ground/frame_selection.json and stages 4-14 read it back from there.
  img_idx: auto
  frame_selection:
    # heuristic -- geometry/sharpness scoring only, no remote calls
    # vlm       -- VLM chooses among every frame that passes the gates
    # hybrid    -- heuristic short-lists vlm_top_k frames, VLM makes the final call
    # The VLM step is fail-soft: without credentials it falls back to the heuristic winner.
    mode: hybrid
    max_candidates: 24            # cap on frames scored (evenly strided) to bound SAM3 cost
    min_object_height: 0.015      # m above the support plane before geometry counts as an object
    max_object_height: 0.6        # m above the plane, to exclude walls/people behind the surface
    min_component_px: 50          # ignore object blobs smaller than this when counting objects
    max_tilt: null                # null -> inherit floor_tilt_threshold; reject rolled frames
    min_plane_inlier_ratio: 0.6   # reject frames whose support surface does not fit a plane
    min_support_coverage: 0.05    # reject frames where the support surface barely appears
    max_clipped_frac: 0.5         # reject frames with more than this share of object area cut off
    clipped_penalty: 0.35         # score penalty per unit fraction of object area cut off
    vlm_top_k: 4                  # frames sent to the VLM in hybrid mode
    vlm_max_side: 1024            # candidate images are downscaled to this before upload
    vlm_model: null               # null -> inherit s3_ground.detection_model
    write_debug_sheet: true       # s3_ground/frame_selection.png, scored contact sheet
    weights:
      object_coverage: 0.40       # image fraction filled by objects on the support surface
      object_separation: 0.20     # distinct object blobs; occluding objects merge into one
      sharpness: 0.20             # Laplacian variance around the objects, at source resolution
      support_coverage: 0.10      # how much of the frame the support surface fills
      plane_quality: 0.10         # RANSAC inlier ratio of the support plane fit
  use_fs: false  # Set to true to use FoundationStereo output (s2_fs) instead of Depth Anything (s2_da)
  detection_model: gemini-3.1-pro-preview   # options: gemini-2.5-pro, gemini-2.5-flash, gemini-3.1-pro-preview, gemini-3-flash-preview
s4_frame:     # env: simfoundry
  rerun: true
  out_dirname: s4_frame
  out_dir: "${root_dir}/${scene_name}/${s4_frame.out_dirname}"
  z_far: 5.0
  denoise_nb_points: 30
  denoise_radius: 0.03
s5_scene:     # env: simfoundry
  # Single source of truth for stage 5. Previously split across s5_scene and
  # s5_scene, where the stage read _gmask but downstream stages read s5_scene.
  rerun: true
  out_dirname: s5_scene
  out_dir: "${root_dir}/${scene_name}/${s5_scene.out_dirname}"
  img_idx: "${s3_ground.img_idx}"
  ratio: "4:3"
  sam_conf_threshold: 0.35
  start_iter: null
  end_iter: null
  force_categories: null
  use_feedback: false   # If true, use rerun_feedback.json from 5b_visualize_decomposition.py
  use_upsampled_source_image: true   # If true, seed decomposition with the removal model's upsampled source (source_padded_resized_upsampled.png). If false, use source_padded_resized.png as-is, skipping the upsample call.
  removal_outline_color: [0, 255, 0]
  boundary_proportion: 0.02 #0.1
  z_prune_threshold: -0.05
  z_prune_threshold_proportion: 0.1
  overlap_threshold_proportion: 0.9
  duplicate_mask_intersect_area_threshold: 0.95
  min_valid_pixel_prop: 0.10
  update_categories_period: 3
  merge_output_images: true
  crop_removal_images: true
  # vlm_model: gemini-2.5-pro     # options: gemini-2.5-pro, gemini-2.5-flash, gemini-3-pro
  detection_model: gemini-3.1-pro-preview   # options: gemini-2.5-pro, gemini-2.5-flash, gemini-3.1-pro-preview, gemini-3-flash-preview
  removal_model: gemini-3-pro-image     # options: gemini, gemini-3-pro-image, gemini-3-pro-image, flux
  min_detection_iterations: 3
  obj_removal_prompt_order: ["mask", "outline", "bbox"]   # options: mask, outline, bbox. For FLUX, use ["outline", "bbox"], mask is not stable.
  pda_K: 5
  pda_geometric_backend: da3    # options: depth_pro, da3  (geometric depth source for PriorDepthAnything)
  pda_da3_resolution: 504             # DA3 processing resolution (must be multiple of 14, only used when pda_geometric_backend=da3)
s6_upsample:      # env: simfoundry
  rerun: true
  out_dirname: s6_upsample
  out_dir: "${root_dir}/${scene_name}/${s6_upsample.out_dirname}"
  sam_conf_threshold: 0.1
  model: gemini-3-pro-image     # options: gemini, gemini-2.5-flash-image, gemini-3-pro-image, gpt, flux
  validity_model: gemini
  infill: false    # If true, infill the object before upsampling
  check_valid: false  # If true, run validity check on each upsampled object
  object_indices: null  # null = all, or [1,2] for selective streaming/reruns
  remove_bg_max_side: 1024  # Downscale before rembg inference to reduce ONNX memory use; null disables
  include_invalid: true  # If true, process objects that s5 marked as invalid (is_valid_removed_obj=false)
s7_mesh:          # env: mesh
  rerun: true
  out_dirname: s7_mesh
  out_dir: "${root_dir}/${scene_name}/${s7_mesh.out_dirname}"
  generate_shape: true
  generate_texture: true
  shape_model: hunyuan #hunyuan #trellis2 #pixal3d #direct3d
  texture_model: hunyuan #hunyuan #trellis2 #pixal3d
  save_intermediates: true
  low_vram: false        # If true, enable CPU offloading to reduce GPU VRAM (~29GB -> ~6GB for shape gen)
  object_indices: null   # null = process all, or set [3, 7] to process specific objects
  # Backend-specific generation options, forwarded to the generator. Keys the selected backend
  # cannot accept are dropped with a warning. `seed` defaults to the global `seed` above.
  # NOTE: this dict starts empty, so adding a key from the CLI needs Hydra's `+` prefix
  # (`+s7_mesh.generation_kwargs.resolution=1024`); keys listed here are overridden normally.
  # Examples for pixal3d:
  #   resolution: 1536     # 1024 or 1536; 1024 is the low_vram default
  #   fov: 0.2             # radians; skips MoGe-2 camera estimation. Try this if output is distorted
  #   num_faces: 300000    # decimation target
  #   remesh: true
  #   remesh_project: 0     # 0 = upstream default; trellis2 uses 0.9
  #   max_num_tokens: 49152
  #   shape_slat_sampling_steps: 12   # ss_ / shape_slat_ / tex_slat_ prefixes route to samplers
  generation_kwargs: {}
stage_review:
  mode: upsample   # options: depth, upsample, mesh
stream_subseq:
  start_stage: 5        # start stage in contiguous subsequence (5-8)
  end_stage: 8          # end stage in contiguous subsequence (5-8)
  poll_interval_s: 3.0
  idle_timeout_s: 120.0
  # Backstop only. Producers publish artifacts atomically (write to <name>.partial.<ext>, then
  # rename), so a consumer cannot observe a partial file and this does not need to cover a
  # producer's slowest write. It cannot anyway: stage 8 once read a half-copied 41 MB .glb as a
  # mesh with zero triangles despite a 5 s window, because the copy stalled longer than that.
  artifact_settle_s: 1.0
  # VRAM budget for streamed stages, as a fraction of the GPU's TOTAL memory. Sizing it
  # relative to the card means one setting works on a 24 GiB and a 96 GiB GPU.
  max_vram_frac: 0.9
  # Opt-in absolute override in GiB (run.sh --max-vram-gb). Null means the fraction above
  # applies; setting a value here takes precedence over max_vram_frac. Opt-in because a value
  # too small for the card stalls stages: with hard_vram_cap the budget is compared against
  # TOTAL GPU usage, so unrelated processes count against it.
  max_vram_gb: null
  hard_vram_cap: true
  gpu_index: 0
  memory_poll_interval_s: 3.0
  vram_wait_log_interval_s: 60.0   # How often to log why a stage is paused waiting for VRAM
  vram_wait_timeout_s: null        # Give up after this many seconds waiting; null = wait forever
  analytics_path: null
  # Pre-flight estimates only, sized so every stage is admitted on the minimum supported
  # card (16 GiB total, 90% budget = 14.4 GiB usable). The scheduler raises when an
  # estimate exceeds the budget, so estimates above ~14.4 would hard-block the minimum
  # card before the stage even starts. Stage 5's estimate matches its measured ~14 GiB
  # peak; actual usage is governed at runtime by the measured-usage check (hard_vram_cap).
  # Stage 7 additionally needs s7_mesh.low_vram=true on cards below ~29 GiB.
  #
  # NOTE for pixal3d: stage 7's estimate below assumes the default `hunyuan` backend; raise it
  # when selecting pixal3d, or stage 7 is admitted alongside stage 6 and then OOMs.
  #   pixal3d  ~15 MEASURED with s7_mesh.low_vram=true (resolution 1024): 14.22 GiB peak on an
  #            RTX 4090, 409x409 input, torch.cuda.max_memory_allocated. Larger inputs cost more.
  #            The resolution-1536 default (s7_mesh.low_vram=false) was TESTED on the same
  #            RTX 4090 and OOMs — do not use it on 24 GiB. Treat low_vram=true as required there.
  #            Peak briefly exceeds the pipeline itself because MoGe-2 is moved onto the GPU for
  #            camera estimation while the pipeline is resident (it is parked on CPU otherwise).
  # An estimate larger than the budget (max_vram_frac * total, default 0.9) is rejected outright,
  # so on a 24 GiB card pixal3d at 1536 needs max_vram_frac raised or low_vram=true.
  # Streaming relaunches stage 7 per object, reloading ~18 GiB of models every time, so
  # `--no-stream` (or `--include 7`) is an operational requirement with pixal3d, not a tuning
  # suggestion. Leaving streaming on is slow enough to look like a hang.
  stage_vram_gb:
    5: 14
    6: 4
    7: 10
    8: 4
  s5_cmd: "python scripts/pipeline/A_reconstruction/stages/5_decompose_scene.py"
  s6_cmd: "python scripts/pipeline/A_reconstruction/stages/6_upsample_object_images.py"
  s7_cmd: "python scripts/pipeline/A_reconstruction/stages/7_generate_object_meshes.py"
  s8_cmd: "python scripts/pipeline/A_reconstruction/stages/8_match_object_poses.py"
s8_pose:          # env: simfoundry
  only_indices: # Can be a single int, a list of ints, or None (process all)
  rerun: true
  out_dirname: s8_pose
  out_dir: "${root_dir}/${scene_name}/${s8_pose.out_dirname}"
  source_voxel_scale_factor: 0.25
  voxel_size: 0.04
  n_samples: 20
  use_foundationpose: true
  est_refine_iter: 5  # Number of refinement iterations for FoundationPose
  object_indices: null  # null = all, or [1,2] for selective streaming/reruns
  canonicalize_front: true      # VLM front-pick; rotates the (uprighted) mesh front to +Z
  front_pick_model: gemini-3.1-pro-preview
  # Fine yaw passes for tilt-baked (pixel-aligned) meshes ONLY — canonical backends land
  # exactly on the 45-degree grid and a re-pick can only move them off it.
  # front_refine: second VLM pass over +/-22.5 deg in 7.5-deg steps around the coarse pick.
  front_refine: true
  # front_yaw_snap: align the upright footprint's min-area rectangle with the x/z axes
  # (bounded to +/-45 deg; skipped for round footprints).
  front_yaw_snap: true
  # Pixel-aligned backends (pixal3d) generate in the conditioning image's camera frame, so the
  # conditioning viewpoint's elevation/roll is baked into the s7 mesh (measured ~34 deg on a
  # real run, vs <10 deg for hunyuan/trellis, which emit a canonical upright frame). The
  # full-SO(3) fit measures that tilt against the scene cloud; when trusted, its pitch/roll
  # component is baked into canonical_mesh (consumed by stage 9 articulation, stages 10/11, and
  # cousin generation) and the stored pose keeps only gravity yaw + translation + scale.
  # With use_foundationpose the tilt is re-derived from FoundationPose's pose, which
  # disambiguates the symmetry flips that fool the CPD restarts on boxy objects.
  # auto = bake only for pixel-aligned shape backends (pixal3d). Canonical-frame backends
  # (hunyuan/trellis2/direct3d) are upright by construction, so a fitted tilt there is a fit
  # error or the object's physical placement — baking either corrupts the mesh. true/false force it.
  bake_fitted_tilt: auto
  min_tilt_deg: 10.0        # below this the mesh already counts as upright — no bake, no churn
  max_tilt_deg: 80.0        # an implied tilt above this is treated as a failed fit — no bake
  tilt_consensus_deg: 20.0  # top fits must agree on the up axis within this angle to be trusted
  # use_any6d: true
  # resume_idx: Controls the interactive pose editing workflow (8b_match_object_poses_interactive.py)
  #   null  -> Normal mode: run pose fitting from scratch, auto-generate suffix for output
  #   -1    -> Load from info/ (automatic poses), save to info_interactive/
  #   0     -> Load from info_interactive/, save to info_interactive_1/
  #   1     -> Load from info_interactive_1/, save to info_interactive_2/
  #   N     -> Load from info_interactive_N/, save to info_interactive_{N+1}/
  # This allows iterative refinement of object poses through multiple interactive sessions.
  resume_idx: 1
s9_articulate_objects:
  rerun: true
  out_dirname: s9_articulate_objects
  out_dir: "${root_dir}/${scene_name}/${s9_articulate_objects.out_dirname}"
  vlm_model: gemini-3.1-pro-preview
  vlm_backend: vertex                 # [vertex] — routes all articulation VLM calls (classifier + s2/s4/s5) through Vertex AI Gemini using gcloud_project
  method: hunyuan # options : [hunyuan, partfield]
  tree_model: gemini-3.1-pro-preview       # articulate-anything s2 VLM model
  merge_model: gemini-3.1-pro-preview        # articulate-anything s4 VLM model
  s5_model: gemini-3.1-pro-preview           # articulate-anything joint-refinement VLM model
  # Critic on: its rubric has a `joint_limit` category covering the failure mode seen on
  # reconstructed assets (wrong range/direction). Previously true, commented "avoid brittle
  # critic loop" - re-enable with max_iter>1 so a flagged joint actually gets a second attempt;
  # a critic with max_iter=1 reports but cannot correct. Set actor_only=true to revert.
  s5_actor_only: false
  s5_max_iter: 5
  s5_num_seeds: 1
  merge_interactive_correction: false # Keep the generated articulation workflow unattended by default
  # Interactive joint-refinement UI (articulate-anything step 6): opens a web UI
  # after articulation to refine joint limits, pivots, axes, and dynamics.
  # Also applies to already-articulated objects (they are passed through the
  # workflow for refinement without being re-articulated).
  interactive_joint_refinement: false
  # Classification review options:
  classification_only: false          # If true, stop after writing object_classification.json
  interactive_review: false          # If true, prompt user to review/modify VLM classification
  force_articulated: []               # List of object names to force as articulated (overrides VLM)
  force_non_articulated: ["white robotic arm", 'white and black robotic arm', 'small black electronic component', 'blue cup', 'small metallic sensor', 'purple cable']           # List of object names to force as non-articulated (overrides VLM)
s10_compile:      # env: simfoundry
  rerun: true
  out_dirname: s10_compile
  out_dir: "${root_dir}/${scene_name}/${s10_compile.out_dirname}"
  # use_interactive_pose: Whether to use manually-refined poses from interactive editing sessions
  #   false -> Use automatic poses from info/ directory (output of 8_match_object_poses.py)
  #   true  -> Use interactive poses from info_interactive{interactive_suffix}/ directory
  #            (output of 8b_match_object_poses_interactive.py)
  use_interactive_pose: false
  # interactive_suffix: Specifies which interactive pose folder to use when use_interactive_pose=true
  #   ""   -> Use info_interactive/ (first interactive session)
  #   "_1" -> Use info_interactive_1/ (second interactive session)
  #   "_2" -> Use info_interactive_2/ (third interactive session), etc.
  # Must match the suffix used when saving poses in 8b_match_object_poses_interactive.py
  interactive_suffix: "_2"
s11_sim:          # env: simfoundry
  rerun: true
  out_dirname: s11_sim
  out_dir: "${root_dir}/${scene_name}/${s11_sim.out_dirname}"
  vlm_model: gemini-3.1-pro-preview   # options: gemini-2.5-pro, gemini-2.5-flash, gemini-3.1-pro-preview
  object_indices: null
  parallel_workers: 2
  collision_method: coacd
  hull_count: 32
  n_submesh: 10
s12_physics:      # env: simfoundry
  rerun: true
  out_dirname: s12_physics
  out_dir: "${root_dir}/${scene_name}/${s12_physics.out_dirname}"
  load_at_once: true    # Whether to load all objects at once, then stabilize them together simultaneously, load in reverse order if false.
s13_usd: #env b1k
  rerun: true
  out_dirname: s13_usd
  out_dir: "${root_dir}/${scene_name}/${s13_usd.out_dirname}"
  dataset_name: real2sim-assets
  # Materials opacity threshold for USD export of TRELLIS2 meshes
  opacity_threshold: 0.5
  # Bind materials through OmniGibson's asset pipeline so the metalness/glossiness maps
  # stage 11 writes (map_Pm/map_Pr) reach the USD. Objects whose base color carries real
  # alpha keep the URDF importer's OmniPBR_Opacity materials for the opacity pass above.
  asset_pipeline_materials: true
s14_og:
  rerun: true
  out_dirname: s14_og
  out_dir: "${root_dir}/${scene_name}/${s14_og.out_dirname}"
  dataset_name: ${s13_usd.dataset_name}
  robot_config:
    type: FrankaPanda
    # Public OmniGibson robot assets include the stock Panda gripper. Robotiq
    # remains supported via Hydra override when SimFoundry-specific robot assets are installed.
    end_effector: gripper
    name: robot0
    self_collisions: false
    obs_modalities: [rgb, depth_linear, proprio]
    action_normalize: false
    grasping_mode: assisted
    position: [-1.0, 0.0, 0.0]
    orientation: [0, 0, 0, 1]
  include_table: false
  include_robot: true
  # Use the Gaussian-splat background from the auto_bg_reconstruction pipeline. Off by default
  # because stage 2c (the splat producer) is opt-in via --bg-splat: leaving this on made the
  # default pipeline consume an artifact the default pipeline never produced. It also forces
  # floor_plane_visible and use_skybox off, so turning it on without a splat yields a scene
  # with an invisible floor and no sky.
  include_gs: false
  randomize_xy_range: 0.01
  randomize_z_rotation_deg: 50           # Z-axis rotation range: 360 = full [0,360°), else ±N degrees (e.g. 30 = ±30°)
  randomize_settle_steps: 100
  auto_generation: true
  auto_iter_num: 10
  auto_camera_pos: [-0.0170, -0.9410, 1.5506]
  auto_camera_ori: [0.3340, 0.0038, 0.0106, 0.9425]
  auto_calibration_trials: 1
  auto_calibration_perturbation: 0.001
  check_touching: false                     # If true, validate touching relationships in auto_generation; if false, only on_top is checked
  external_sensors_cfg: nv_franka_droid    # Located in <CFG_DIR>/external_sensors
  capture_image: true
  interactive: false
  fast_process_exit: true
s14_teleop:
  rerun: true
  task_name: ${task.task_name}                  # Task YAML name (use task=load_scene then task.task_name=serve_the_orange for scene-specific task)
  scene_json_name: null                            # Name of scene JSON to load (located in SIMFOUNDRY_ASSET_DIR/scenes, without json extension) (null = use s14_og output)
  # Scene source options:
  # - reconstructed: use the reconstructed scene from s14_og
  # - load_sampling: load sampled scene(s) from sampling_scene/auto_generation and collect success_demo_per_sampling successful demos per scene into one HDF5
  scene_source: reconstructed             # "reconstructed" | "load_sampling"
  sampling_scene_indices: null                # When scene_source=load_sampling: null = all valid scenes, or list of indices to select (e.g. [0], [0,2,5])
  use_floor_plane: true
  floor_plane_visible: true
  out_dirname: s14_teleop
  out_dir: "${root_dir}/${scene_name}/${s14_teleop.out_dirname}"
  instance_id: 0
  external_sensors_cfg: sim_franka_teleop     # Located in <CFG_DIR>/external_sensors
  max_steps: 500
  action_freq: 15
  arm_speed_scaledown: 0.04                   # Scaling factor for EEF control of robot using spacemouse
  arm_rot_speed_scaledown: [0.08, 0.08, 0.16]               # Scaling factor for EEF rotation control of robot using spacemouse
  device: spacemouse          #  [keyboard, spacemouse, oculus]
  save_data: true
  object_swap_json: null                  # Path to JSON mapping object names to replacement USD paths (e.g., assets/cousins/StackDishware/swap.json). See assets/cousins/ for example cousin USDs.
  highlight_objects: false                 # If true, tint all non-robot/non-background objects light green for teleop visibility
  hide_robot_body: true                   # If true, hide robot arm links (gripper/EEF links remain visible)
  use_deterministic_pose_schedule: false   # If true, pre-compute N deterministic z-rotation configs and collect exactly 1 success per config
  n_deterministic_samples: 0              # Number of evenly-spaced z-rotation configurations to sample
  success_demo_per_sampling: 1            # Number of successful demos required per sampled scene when scene_source=load_sampling
  data_env_kwargs:
    # Prim path for the camera used when recording viewport during teleop. Options:
    # - .../external_cam0          (robot-mounted, one side)
    # - .../external_cam0_opposite (robot-mounted, opposite; matches sim_franka_teleop sensor)
    # - /World/viewer_camera       (default free viewer camera)
    viewport_camera_path: /World/scene_0/controllable__frankapanda__robot0/panda_link0/external_cam0_opposite
    overwrite: true       # shouldn't make a difference because every dataset is written to unique timestamp
    only_successes: true
    obj_attr_keys: [scale, visible]
    flush_every_n_traj: 10


s15_eval:       # env: b1k -- Evaluate Gr00t checkpoint on OmniGibson scene
  rerun: true
  
  out_dirname: s15_eval
  checkpoint: gr00t_base # TODO: get this from policy metadata later
  host: "localhost"
  # policy : openpi # [openpi, gr00t]
  # port: 8000 # 8000 for OpenPI, 5555 for Gr00t
  policy : gr00t # [openpi, gr00t]
  port: 5555 # 8000 for OpenPI, 5555 for Gr00t
  # port: 5555 # 8000 for OpenPI, 5555 for Gr00t
  out_dir: "${root_dir}/${scene_name}/${s15_eval.out_dirname}/${s15_eval.policy}"
  asset_id: franka                        # Normalization stats ID: 'franka' (joint pos) or 'droid' (joint vel)
  scene_json: droid_desk_stack_dishware                # Path to scene JSON (null = use s14_og output)
  use_floor_plane: true
  floor_plane_visible: false
  external_sensors_cfg: nv_franka_droid   # Located in <CFG_DIR>/external_sensors
  action_freq: 15                         # Action frequency in Hz
  timeout_s: 90                            # Maximum episode timeout in seconds
  execute_horizon: 8                     # Number of actions to execute per policy inference
  n_episodes: 20                          # Number of evaluation episodes
  init_states_path: null                  # Optional path to init_states.json for deterministic evals
  prompt: "put the blue bowl on the green plate, then put the white cup in the blue bowl" 
  # prompt: "open the trash can, pick up the cup, put the cup into the trash can, and then close the trash can"            # Language prompt for the policy
  base_camera_1_name: external_cam0_left  # Name of the first external camera (DROID exterior_image_1)
  base_camera_2_name: external_cam1_left  # Name of the second external camera (DROID exterior_image_2)
  interactive: false                      # If true, drops into IPython for interactive evaluation
  save_video: true                        # If true, saves video of policy observations per episode
  video_fps: 10                             # FPS for saved videos
s15_annotate:     # env: b1k
  rerun: true
  out_dirname: s15_annotation
  out_dir: "${root_dir}/${scene_name}/${s15_annotate.out_dirname}"
  robot_id: 0
  check_gripper_open_during_place: true
  filter: null                            # If set, processes ALL HDF5 files from s14 matching this substring (e.g. "cousin")
s16_waypoints:     # env: b1k
  rerun: true
  out_dirname: s16_waypoints
  out_dir: "${root_dir}/${scene_name}/${s16_waypoints.out_dirname}"

  # EEF pose adjustment
  eef_z_offset: 0.0               # Z offset in local EEF frame to apply when tracking EEF pose (meters)

  # Distance-based extraction (PRIMARY - must satisfy)
  pick_min_start_distance: 0.15     # EEF must start at least this far from object (meters)
  pick_max_distance: 0.30          # Stop when EEF exceeds this distance from object
  place_min_start_distance: 0.15    # EEF must start at least this far from target surface
  place_max_distance: 0.30         # Stop when EEF exceeds this distance from target
  open_min_start_distance: 0.09     # EEF must start at least this far from articulated object (meters)
  open_max_distance: 0.50          # Stop when EEF exceeds this distance from articulated object
  close_min_start_distance: 0.09    # EEF must start at least this far from articulated object (meters)
  close_max_distance: 0.50         # Stop when EEF exceeds this distance from articulated object
  end_z_threshold: 0.05            # Stop when distance exceeds this (euclidean from signal EEF for pick/place, relative vertical to link for open/close, meters)
  merge_sequences: true            # If true, merge adjacent subtask sequences sharing the same reference object frame (skips freespace interpolation between them)
  use_open_grasp_signal: true     # If true, for "open" signals, verify gripper is closed and use gripper release + L2 distance as stopping condition
  open_grasp_max_distance: 0.15   # L2 distance threshold from EEF at gripper release (meters, only used when use_open_grasp_signal=true)
  filter: null                    # If set, processes ALL annotation/HDF5 pairs from s15/s14 matching this substring
s17_generate:     # env: b1k
  rerun: true
  out_dirname: s17_generated_demos
  out_dir: "${root_dir}/${scene_name}/${s17_generate.out_dirname}"
  action_frequency: 15      # Action frequency in Hz
  n_demos: 1000                # Number of successful demos to generate
  max_attempts: 2000          # Maximum generation attempts
  use_curobo: false         # If true, use CuRobo motion planning; if false, use linear interpolation
  curobo_max_attempts: 10   # CuRobo motion planning max attempts
  curobo_timeout: 60.0      # CuRobo planning timeout in seconds
  freespace_velocity: 0.1   # Target end-effector velocity for freespace motion (m/s), used when use_curobo=false
  smooth_freespace: true   # If true, use spline-based freespace interpolation with velocity profiling for smooth transitions
  smooth_n_boundary_waypoints: 5      # Number of waypoints sampled from each adjacent segment boundary for direction/velocity estimation
  smooth_velocity_ramp_fraction: 0.25 # Fraction of spline arc length used for velocity ramp at each end (0.25 = first 25% ramps up, last 25% ramps down)
  smooth_spline_tangent_scale: 1.0    # Multiplier for cubic Hermite tangent magnitudes; larger values produce wider curves, smaller values approach a straight line
  smooth_spline_samples: 1000         # Internal resolution for spline arc-length computation (higher = more accurate but slower)
  inverted_gripper: false   # If true, invert the gripper action (0.0 = open, 1.0 = closed)
  eef_z_offset: "${s16_waypoints.eef_z_offset}"  # Z offset in local EEF frame (should match s16_waypoints.eef_z_offset)
  grasping_type: assisted       # If set, override robot grasping mode. Valid options: "physical", "assisted". Default null = no override
  max_joint_velocity: 0.2  # If set (rad/step), terminate episode if any arm joint exceeds this per-step position change. Detects degenerate shaking from collisions/singularities
  k_nearest_neighbors: [3,3]     # Top-K nearest neighbors to sample from. Scalar, per-type dict, or list (one per subtask)
    # pick: 1
    # place: 1
    # open: 1
    # close: 1
  knn_pos_weight: [0.5,0.5]          # Weight for position L2 distance in KNN selection. Scalar, per-type dict, or list (one per subtask)
    # pick: 0.5
    # place: 0.5
    # open: 0.5
    # close: 0.5
  knn_ori_weight: [2.0,2.0]           # Weight for orientation angular distance in KNN selection. Scalar, per-type dict, or list (one per subtask)
    # pick: 2.0
    # place: 2.0
    # open: 2.0
    # close: 2.0
  blacklist_ids: null             # Optional list of lists: outer length = n_subtasks, inner lists = episode IDs to exclude from KNN selection per subtask
  resample_scene:                 # Opt-in scene resampling using validated group-based perturbation (mirrors scene_sampling.py)
    enabled: false                # If true, resample a new valid scene config every N successful demos
    every_n_demos: 1              # Interval (in successful demos) between resamples
    xy_range: 0.03                # Per-group XY perturbation range in meters
    z_rotation_deg: 20            # Per-group Z rotation perturbation in +/- degrees (null or >=360 = full rotation)
    settle_steps: 100             # Physics settle steps after reloading objects
    max_attempts: 20              # Max resample attempts to find a valid config before giving up for this interval
    resample_initial: false       # If true, resample before the very first demo of each dataset
    include_fixed_base_groups: true   # If true, also randomize groups containing fixed_base fixtures (e.g. desks, organizers). They are re-pinned via keep_still() + update_initial_file() after settling
    max_consecutive_failures: 1   # If the current sampled scene fails to produce a demo this many times in a row, force a new resample (0 or null = disabled)
    per_group_attempts: 10          # Max placement attempts per group before restarting the sequence
    min_group_distance: 0.0          # Min XY clearance between group AABBs in meters (0 = rely on physics validation only)
    max_rejection_samples: 50       # Max rejection samples for AABB collision avoidance per group attempt
  action_noise:                   # TCP-bounded action noise for domain randomization (similar to Molmospaces)
    enabled: true                 # Whether to apply action noise during data generation
    action_scale_factor: 0.1      # Arm noise std = scale * ||tcp_delta|| (10% of commanded TCP delta)
    rotation_noise_scale: 0.1     # Rotation noise scale relative to position noise
    max_tcp_position_noise: 0.02  # Maximum position noise in TCP space (meters)
    max_tcp_rotation_noise: 0.1   # Maximum rotation noise in TCP space (radians, ~5.7 degrees)
    apply_to_freespace: true      # Whether to apply noise during freespace motions (in addition to waypoint tracking)
  filter: null                    # If set, processes ALL waypoint/config pairs from s16/s15 matching this substring (n_demos and max_attempts apply per dataset)
  output_name: null               # If set, use as the HDF5 output tag (e.g. "v2" -> generated_demos_v2.hdf5). If null, name is inferred from resample parameters
  save_video: false                         # Save high-res MP4 videos from external cameras with trajectory overlay during generation
  video_fps: 15                             # Video frame rate (typically matches action_frequency)
  external_sensors_cfg: nv_franka_droid_high_res  # External sensor YAML for video cameras (in scripts/cfg/external_sensors/)
  video_only_successes: true                # Only save videos for successful demos (saves disk space)
s18_replay:          # env: b1k
  rerun: true
  out_dirname: s18_replay
  out_dir: "${root_dir}/${scene_name}/${s18_replay.out_dirname}"
  repo_prefix: "omnigibson"                    # Prefix for LeRobot dataset repo_id (e.g., "username")
  dataset_name: "${scene_name}_${task.task_name}"  # Name of the LeRobot dataset
  include_mimicgen_data: true                     # Either include mimicgen data generated in step 17 or not
  external_sensors_cfg: nv_franka_droid    # Located in <CFG_DIR>/external_sensors
  filter: null                                     # If set, processes ALL generated demo HDF5s from s17 (or s14) matching this substring (spawns subprocesses)
  modality_json: ../../simfoundry/configs/modality/droid_modality.json   # If set, path to a modality.json that replaces the auto-generated one in each output dataset
  depth_as_rgb: false                            # Whether depth should be saved in encoded RGB or not
  use_pointbridge: false                         # Whether to use LeRobotPointbridgePlaybackWrapper for point cloud generation
  pointbridge_kwargs:                            # Kwargs for LeRobotPointbridgePlaybackWrapper (only used if use_pointbridge=true)
    num_points_obj: 128                          # Number of points to sample for each object in point cloud
    num_objects: 1                               # Number of objects to sample in point cloud
    include_categories: null                     # Categories to include in point cloud (null = all categories)
    pc_x_min: -2.0                               # Min X workspace bound for point cloud (in robot frame)
    pc_x_max: 2.0                                # Max X workspace bound for point cloud (in robot frame)
    pc_y_min: -2.0                               # Min Y workspace bound for point cloud (in robot frame)
    pc_y_max: 2.0                                # Max Y workspace bound for point cloud (in robot frame)
    pc_z_min: -2.0                              # Min Z workspace bound for point cloud (in robot frame)
    pc_z_max: 2.0                                # Max Z workspace bound for point cloud (in robot frame)
    pointcloud_sensors: null                     # Sensors to generate point clouds from (null = all depth sensors)
  playback_kwargs:
    n_episodes: null                         # Number of episodes to replay
    robot_obs_modalities: [rgb, proprio]  # Robot observation modalities to collect
    robot_proprio_keys: [arm_0_qpos, arm_0_qvel, eef_0_pos, eef_0_quat, gripper_0_qpos, gripper_0_qpos_norm]                     # Optional list of proprioception keys to use
    robot_sensor_config:                         # Optional sensor configuration override
      VisionSensor:
        modalities: [rgb]
        sensor_kwargs:
          image_height: 180 #720
          image_width: 320 #1280
    external_sensors_config: nv_franka_droid                # DO NOT MODIFY -- this is auto-loaded from @external_sensors_cfg
    include_sensor_names: null                   # Optional list of sensor name substrings to include
    exclude_sensor_names: null                   # Optional list of sensor name substrings to exclude
    n_render_iterations: 1                       # Number of rendering iterations per frame
    overwrite: true                              # Whether to overwrite existing dataset
    only_successes: true                         # Whether to only save successful episodes
    flush_every_n_traj: 10                       # How often to flush data to disk (across episodes)
    flush_every_n_steps: 0                       # How often to flush within episodes (0 = disabled)
    include_task: true                           # Whether to include the original task
    include_task_obs: true                       # Whether to include task observations
    include_robot_control: true                  # Whether to enable robot control during playback
    include_contacts: true                       # Whether to enable contacts (physics) during playback
    include_env_wrapper: false                   # Whether to include environment wrapper class during instantiation
    robot_type: null                             # Robot type name (null = auto-infer from env)
    image_writer_threads: 10                     # Number of threads for writing images
    image_writer_processes: 5                    # Number of processes for writing images
    task_name: null                              # Task name (null = auto-infer from task)
    lerobot_version: "v2.1"                      # LeRobot version (v2.1 or v3.0)
    use_videos: true                            # Whether to use videos or not
    include_multi_action_representation: false    # Whether to include multi action representation in the dataset
    include_modalities: [rgb, proprio]                      # Modalities to include in the dataset
  # Data transformations (applied during saving only, not during env execution)
  invert_gripper_action: true                    # If true, invert gripper action: action[-1] = 1 - action[-1]
  scale_gripper_state: 1.0                       # Factor to multiply gripper state (observation.state[-1]) by
  # Domain randomization (visual augmentation during replay)
  domain_randomization:
    enabled: true                               # Master switch for all domain randomization
    randomize_interval_steps: 30                  # Steps between randomization updates (0 = only at episode start)
    materials:
      enabled: true                             # Enable material/texture randomization
      object_names: null                           # Object names to randomize (e.g., [obj_0, obj_1]). None defaults to all included, except robots / background
      randomize_robot: false                     # Whether to also randomize robot materials
      material_preset: default_train                      # Preset name: "default_train", "default_eval", or null for library discovery
      categories: null                           # Material categories to use (null = all). e.g., [Wood, Metals, Plastics]
      num_variants_per_material: 3               # Randomized variant copies per material (null = one per natural variant)
      include_wood: true                         # Include curated wood materials
      include_metal: true                        # Include curated metal materials
      include_plastic: true                      # Include curated plastic materials
      include_paint: true                        # Include curated paint/textile materials
    lighting:
      enabled: true                             # Enable lighting randomization
      dome_intensity_range: [300.0, 1200.0]      # Min/max dome light intensity
      dome_color_temperature_range: [4000.0, 8000.0]  # Min/max color temperature in Kelvin
      use_hdri_textures: true                   # Use HDRI textures for environment lighting
      randomize_hdri_rotation: true              # Randomly rotate the HDRI environment
      hdri_rotation_range: [0.0, 360.0]          # Min/max HDRI rotation in degrees
    camera_pose:
      enabled: false                             # Enable camera pose randomization
      position_noise_std: 0.05                  # Std dev of Gaussian noise added to camera position (meters)
      orientation_noise_std: 10.0               # Std dev of Gaussian noise added to camera orientation (degrees)
