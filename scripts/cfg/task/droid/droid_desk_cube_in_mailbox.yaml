task_name: droid_desk_cube_in_mailbox
og_task_config:
  type: PickPlaceTask
  activity_name: ${task_name}
  semantic_group_mapping:
    robot: [agent]
    cube: [blue_cube]
    mailbox: [red_mailbox]
  init_predicates_all: null
  init_predicates_any: null
  init_predicates_specific: null
  goal_predicates_all:
    - state: InsideAABB    # Uses AABB-based check (no container meta links required)
      state_kwargs: null
      value: true
      group: cube
      other_group: mailbox
    - state: Open
      state_kwargs: null
      value: false       
      group: mailbox
      other_group: null
  goal_predicates_any:
    - state: Touching
      state_kwargs: null
      value: false
      group: robot
      other_group: cube
  goal_predicates_specific: null
  # Milestone predicates - tracked during episode (once achieved, remembered)
  # Sequential: each milestone can only be checked if its prerequisites are satisfied
  milestone_predicates:
    - name: mailbox_opened
      state: Open
      state_kwargs: null
      value: true         
      group: mailbox
      other_group: null
      requires: []         # No prerequisites - can be achieved first
    - name: picked_cube
      state: IsGrasping
      state_kwargs: null
      value: true
      group: robot
      other_group: cube
      requires: []  # Must open mailbox before picking cube
    - name: cube_in_mailbox
      state: InsideAABB    # Uses AABB-based check (no container meta links required)
      state_kwargs: null
      value: true
      group: cube
      other_group: mailbox
      requires: [picked_cube]  # Must pick cube before putting it in mailbox
    - name: mailbox_closed
      state: Open
      state_kwargs: null
      value: false         
      group: mailbox
      other_group: null
      requires: [mailbox_opened]  # Must put cube in mailbox before closing
  robot_pose: null
  robot_xyz_randomization: null
  robot_z_rot_randomization: null
  robot_joint_randomization: 0.174    # pi / 18
  group_init_relative_poses:
    # mailbox: [[ 0.6344, -0.23,  0.1700], [-0.3076,  0.6481,  0.6299, -0.2978]] #[[ 0.6544, -0.2831,  0.1600], [-0.3076,  0.6481,  0.6299, -0.2978]]
    mailbox: [[ 0.6844, -0.20,  0.1700], [-0.3076,  0.6481,  0.6299, -0.2978]] #[[ 0.65
    cube: [[ 0.6344, 0.24,  0.1700], [0, 0, 0, 1]] #[[ 0.65
    # fruit: null [[0.65, 0.3023, 0.03], null]
    # plate: null [[0.7, -0.15, 0.04], null] #[[0.0, 0.0, 0.0], null]
  group_xyz_randomization:
    cube: [0.05, 0.05, 0]
    mailbox: [0.02, 0.02, 0] #[0.05, 0.05, 0]
  group_z_rot_randomization:
    cube: 0.174
    mailbox: 0.174
  group_predicate_placement:
    cube:
      reference_group: mailbox
      predicates: [left_of, right_of, behind, in_front_of]
      gap: [0.03, 0.08]    # random gap between 3-8cm
      z_offset: 0.0
  workspace_bounds:              # workspace limits in robot base frame (meters)
    lower: [-1.0, -1.0, -1.0]
    upper: [1.0, 1.0, 1.0]
  group_init_joint_positions:
    mailbox: [-1.97]  
  additional_objects: null
  termination_config:
    max_steps: 1000
  reward_config:
    r_potential: 1.0
  include_obs: false
  hdr_background_name: null
  hdr_background_z_rotation: -1.878