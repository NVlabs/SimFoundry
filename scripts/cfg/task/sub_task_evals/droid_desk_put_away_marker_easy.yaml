task_name: droid_desk_put_away_marker_easy
og_task_config:
  type: PickPlaceTask
  activity_name: ${task_name}
  semantic_group_mapping:
    robot: [agent]
    marker: [red_marker]
    desk_organizer: [wooden_desktop_organizer]
  init_predicates_all: null
  init_predicates_any: null
  init_predicates_specific: null
  goal_predicates_all:
    - state: InsideAABB    # Uses AABB-based check (no container meta links required)
      state_kwargs:
        link_name: drawer_1_link  # Check against top drawer specifically, not entire desk organizer
        shrink_factor: 0.1  # Shrink AABB by 10% on each side (check inner 80% of volume)
        shrink_z_factor: 0.1  # Shrink AABB by 10% on the z-axis (check inner 80% of volume)
      value: true
      group: marker
      other_group: desk_organizer
    - state: Open
      state_kwargs: null
      value: false         
      group: desk_organizer
      other_group: null
  goal_predicates_any:
    - state: Touching
      state_kwargs: null
      value: false
      group: robot
      other_group: marker
  goal_predicates_specific: null
  # Milestone predicates - tracked during episode (once achieved, remembered)
  # Sequential: each milestone can only be checked if its prerequisites are satisfied
  milestone_predicates:    
    - name: picked_marker
      state: IsGrasping
      state_kwargs: null
      value: true
      group: robot          # Check if robot is grasping
      other_group: marker  # the marker
      requires: []  # Must open desk organizer before picking marker
    - name: marker_in_desk_organizer
      state: InsideAABB    # Uses AABB-based check (no container meta links required)
      state_kwargs:
        link_name: drawer_1_link  # Check against top drawer specifically, not entire desk organizer
        shrink_factor: 0.1  # Shrink AABB by 10% on each side (check inner 80% of volume)
        shrink_z_factor: 0.1  # Shrink AABB by 10% on the z-axis (check inner 80% of volume)
      value: true
      group: marker
      other_group: desk_organizer
      requires: []  # Must pick marker before putting it in desk organizer
    - name: desk_organizer_closed
      state: Open
      state_kwargs: null
      value: false         # Desk organizer drawer is closed (Open=false means not open)
      group: desk_organizer
      other_group: null
      requires: []  
  robot_pose: null
  robot_xyz_randomization: null
  robot_z_rot_randomization: null
  robot_joint_randomization: 0.174    # pi / 18
  group_init_relative_poses:
    # trash_can: [[ 0.5344, -0.23,  0.230], [0, 0, 0.9396926, 0.3420201]]  # Upright orientation
    # fruit: null [[0.65, 0.3023, 0.03], null]
    # plate: null [[0.7, -0.15, 0.04], null] #[[0.0, 0.0, 0.0], null]
  group_xyz_randomization:
    marker: [0.05, 0.05, 0]
    desk_organizer: [0.04, 0.04, 0] #[0.05, 0.05, 0]
  group_z_rot_randomization:
    marker: 0.174
    desk_organizer: 0.174
  group_predicate_placement:
    marker:
      reference_group: desk_organizer
      predicates: [left_of, right_of, behind, in_front_of]
      gap: [0.03, 0.08]    # random gap between 3-8cm
      z_offset: 0.0
  workspace_bounds:              # workspace limits in robot base frame (meters)
    lower: [-1.0, -1.0, -1.0]
    upper: [1.0, 1.0, 1.0]
  group_init_joint_positions:
    desk_organizer:
      wooden_desktop_organizer_base_link_to_drawer_1_link: 0.10  # Set drawer joint to open position
  additional_objects: null
  termination_config:
    max_steps: 1000
  reward_config:
    r_potential: 1.0
  include_obs: false
  hdr_background_name: null
  hdr_background_z_rotation: -1.878