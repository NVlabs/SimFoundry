defaults:
  - _self_  # all below configs will override this conf.yaml
#  - arch: ???
#  - task: ???
#  - robot: ???
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: custom

# ===== main cfg =====
root_dir: ../../Data # Where you want to save the data, can be absolute or relative to this config file
scene_name: video_scene  # test # left_table
seed: 0
visualize: false
debug: false
gcloud_project: null # Set to your own GCP project id to use Vertex AI (Gemini).
rerun_all: true

# ===== model init cfgs =====
model:
  hunyuan:
    init_kwargs:


# ===== per-step cfg =====
s1_zed:     # env: zed
  rerun: true  # Set to true to rerun the step, false to skip
  out_dirname: s1_zed
  out_dir: "${root_dir}/${scene_name}/${s1_zed.out_dirname}"
  n_images: 5
  n_sec_between_images: 3
  use_pygame_countdown: false   # Set to true for visual pygame countdown, false for terminal countdown
  show_video_stream: true       # Set to true to show live camera feed during capture, false to disable
s1_video:     # env: cdc
  rerun: true  # Set to true to rerun the step, false to skip
  out_dirname: s1_video
  out_dir: "${root_dir}/${scene_name}/${s1_video.out_dirname}"
  video_fpath: "path/to/Data/video_scene/video_scene.mp4"
  n_subsampled_frames: 15
s2_fs:      # env: fs
  rerun: true
  out_dirname: s2_fs
  out_dir: "${root_dir}/${scene_name}/${s2_fs.out_dirname}"
  resolution: 1008
  fs:
    scale: 0.5
    hiera: 0
    z_far: 2
    valid_iters: 32
    get_pc: 1
    remove_invisible: 1
    denoise_cloud: 1
    denoise_nb_points: 30
    denoise_radius: 0.03
s2_da:      # env: da3
  rerun: true
  out_dirname: s2_da
  out_dir: "${root_dir}/${scene_name}/${s2_da.out_dirname}"
  resolution: 504    # Must be multiple of 14
s3_ground:    # env: cdc
  rerun: true
  out_dirname: s3_ground
  out_dir: "${root_dir}/${scene_name}/${s3_ground.out_dirname}"
  # floor_categories: [ground, carpet, floor, desk, table, counter]
  floor_categories: [desk, table, counter]
  floor_threshold: 0.5
  floor_tilt_threshold: 0.125
  img_idx: 0
s4_frame:     # env: cdc
  rerun: true
  out_dirname: s4_frame
  out_dir: "${root_dir}/${scene_name}/${s4_frame.out_dirname}"
  z_far: 5.0
  denoise_nb_points: 30
  denoise_radius: 0.03
s5_scene:     # env: cdc
  rerun: true
  out_dirname: s5_scene
  out_dir: "${root_dir}/${scene_name}/${s5_scene.out_dirname}"
  img_idx: "${s3_ground.img_idx}"
  ratio: "4:3"
  sam_conf_threshold: 0.4
  start_iter: null
  end_iter: null
  force_categories: null
  removal_outline_color: [0, 255, 0]
  boundary_proportion: null  #0.05 #0.1
  z_prune_threshold: -0.05
  z_prune_threshold_proportion: 0.1
  overlap_threshold_proportion: 0.9
  duplicate_mask_intersect_area_threshold: 0.95
  min_valid_pixel_prop: 0.15
  update_categories_period: 3
  merge_output_images: true
  crop_removal_images: true
  vlm_model: gemini-2.5-pro     # options: gemini-2.5-pro, gemini-2.5-flash, gemini-3-pro
  removal_model: gemini-2.5-flash-image     # options: gemini, flux
  min_detection_iterations: 3
  obj_removal_prompt_order: ["mask", "outline", "bbox"]   # options: mask, outline, bbox
  pda_K: 5
s6_upsample:      # env: cdc
  rerun: true
  out_dirname: s6_upsample
  out_dir: "${root_dir}/${scene_name}/${s6_upsample.out_dirname}"
  model: gemini-2.5-flash-image     # options: gpt, gemini, flux, gemini-3-pro-image-preview
  sam_conf_threshold: 0.4
  validity_model: gemini
s7_mesh:          # env: hunyuan
  rerun: true
  out_dirname: s7_mesh
  out_dir: "${root_dir}/${scene_name}/${s7_mesh.out_dirname}"
  generate_shape: true
  generate_texture: true
  shape_model: hunyuan #direct3d
  texture_model: hunyuan
s7b_articulate_objects:
  rerun: true
  out_dirname: s7_b_articulate_objects
  out_dir: "${root_dir}/${scene_name}/${s7_b_articulate_objects.out_dirname}"
  vlm_model: gemini-2.5-pro
  method: samesh # or hunyuan
s8_pose:          # env: any6d
  rerun: true
  out_dirname: s8_pose
  out_dir: "${root_dir}/${scene_name}/${s8_pose.out_dirname}"
  source_voxel_scale_factor: 0.25
  voxel_size: 0.04
  n_samples: 20
  use_any6d: true
s9_compile:      # env: cdc
  rerun: true
  out_dirname: s9_compile
  out_dir: "${root_dir}/${scene_name}/${s9_compile.out_dirname}"
s10_sim:          # env: cdc
  rerun: true
  out_dirname: s10_sim
  out_dir: "${root_dir}/${scene_name}/${s10_sim.out_dirname}"
  hull_count: 32
  n_submesh: 10
s11_physics:      # env: cdc
  rerun: true
  out_dirname: s11_physics
  out_dir: "${root_dir}/${scene_name}/${s11_physics.out_dirname}"
s12_usd: #env b1k
  rerun: true
  out_dirname: s12_og
  out_dir: "${root_dir}/${scene_name}/${s12_usd.out_dirname}"
s13_og:
  robot: FrankaMounted
  robot_config:
    name: FrankaMounted
    init_position: [0, 12, 0]
    orientation: [0, 0, 1, 0]
  out_dirname: s13_og
  out_dir: "${root_dir}/${scene_name}/${s13_og.out_dirname}"
  include_gs: false
s16_cdc_generation:          # env: hunyuan
  out_dirname: s16_cdc_generation
  source_dir: "${root_dir}/${scene_name}/cousin_images"
  out_dir: "${root_dir}/${scene_name}/${s16_cdc_generation.out_dirname}"
  generate_shape: false
  generate_texture: true
  shape_model: hunyuan #direct3d
  texture_model: hunyuan

# ----------------------------

prefix:
suffix:
postsuffix:

hydra:
  job:
    chdir: true
  run:
    dir: "."
  output_subdir: null
