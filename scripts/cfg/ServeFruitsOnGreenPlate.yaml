defaults:
  - _self_  # all below configs will override this conf.yaml
#  - arch: ???
  - task: droid_desk_serve_fruits
#  - robot: ???
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: custom

# ===== main cfg =====
root_dir: ../../Data/zero_shot_tasks # Where you want to save the data, can be absolute or relative to this config file
scene_name: ServeFruitsOnGreenPlate
seed: 0
visualize: false
debug: false
gcloud_project: ${oc.env:GCLOUD_PROJECT,null} # Set to your own GCP project id to use Vertex AI (Gemini).
rerun_all: true

# ===== model init cfgs =====
model:
  hunyuan:
    init_kwargs:


# ===== per-step cfg =====
s1_zed:     # env: zed
  rerun: true  # Set to true to rerun the step, false to skip
  out_dirname: s1_zed
  out_dir: "${root_dir}/${scene_name}/${s1_zed.out_dirname}"
  n_images: 5
  n_sec_between_images: 3
  use_pygame_countdown: false   # Set to true for visual pygame countdown, false for terminal countdown
  show_video_stream: true       # Set to true to show live camera feed during capture, false to disable
s1_video:     # env: simfoundry
  rerun: true  # Set to true to rerun the step, false to skip
  out_dirname: s1_video
  out_dir: "${root_dir}/${scene_name}/${s1_video.out_dirname}"
  # video_fpath: "${root_dir}/Scene_Video/${scene_name}.MOV"
  video_fpath: "path/to/Data/zero_shot_tasks/ServeFruitsOnGreenPlate/ServeFruitsOnGreenPlate.MOV"
  n_subsampled_frames: 15
s2_fs:      # env: fs
  rerun: true
  out_dirname: s2_fs
  out_dir: "${root_dir}/${scene_name}/${s2_fs.out_dirname}"
  resolution: 1008
  fs:
    scale: 0.5
    hiera: 0
    z_far: 2
    valid_iters: 32
    get_pc: 1
    remove_invisible: 1
    denoise_cloud: 1
    denoise_nb_points: 30
    denoise_radius: 0.03
s2_da:      # env: da3
  rerun: true
  out_dirname: s2_da
  out_dir: "${root_dir}/${scene_name}/${s2_da.out_dirname}"
  resolution: 504    # Must be multiple of 14
s2_depth:    # unified stage-2 backend selector (used by 2_run_depth.py)
  backend: da3   # options: da3, fs
s3_ground:    # env: simfoundry
  rerun: true
  out_dirname: s3_ground
  out_dir: "${root_dir}/${scene_name}/${s3_ground.out_dirname}"
  floor_categories: [desk, table, counter]
  floor_threshold: 0.5
  floor_tilt_threshold: 0.125
  img_idx: 0
s4_frame:     # env: simfoundry
  rerun: true
  out_dirname: s4_frame
  out_dir: "${root_dir}/${scene_name}/${s4_frame.out_dirname}"
  z_far: 5.0
  denoise_nb_points: 30
  denoise_radius: 0.03
s5_scene:     # env: simfoundry
  rerun: true
  out_dirname: s5_scene
  out_dir: "${root_dir}/${scene_name}/${s5_scene.out_dirname}"
  img_idx: "${s3_ground.img_idx}"
  ratio: "4:3"
  sam_conf_threshold: 0.4
  start_iter: null
  end_iter: null
  force_categories: null
  use_feedback: false   # If true, use rerun_feedback.json from 5b_visualize_decomposition.py
  removal_outline_color: [0, 255, 0]
  boundary_proportion: 0.02 #0.1
  z_prune_threshold: -0.05
  z_prune_threshold_proportion: 0.1
  overlap_threshold_proportion: 0.9
  duplicate_mask_intersect_area_threshold: 0.95
  min_valid_pixel_prop: 0.12
  update_categories_period: 3
  merge_output_images: true
  crop_removal_images: true
  vlm_model: gemini-2.5-pro     # options: gemini-2.5-pro, gemini-2.5-flash, gemini-3-pro
  removal_model: gemini-2.5-flash-image     # options: gemini, flux
  min_detection_iterations: 3
  obj_removal_prompt_order: ["mask", "outline", "bbox"]   # options: mask, outline, bbox
  pda_K: 5
  pda_geometric_backend: da3    # options: depth_pro, da3  (geometric depth source for PriorDepthAnything)
  pda_da3_resolution: 504             # DA3 processing resolution (must be multiple of 14, only used when pda_geometric_backend=da3)
s6_upsample:      # env: simfoundry
  rerun: true
  out_dirname: s6_upsample
  out_dir: "${root_dir}/${scene_name}/${s6_upsample.out_dirname}"
  sam_conf_threshold: 0.1
  model: gemini-2.5-flash-image     # options: gpt, gemini, flux
  # model: gemini-3-pro-image     # options: gpt, gemini, flux
  validity_model: gemini
  infill: false    # If true, infill the object before upsampling
  check_valid: false  # If true, run validity check on each upsampled object
  object_indices: null  # null = all, or [1,2] for selective streaming/reruns
s7_mesh:          # env: mesh
  rerun: true
  out_dirname: s7_mesh
  out_dir: "${root_dir}/${scene_name}/${s7_mesh.out_dirname}"
  generate_shape: true
  generate_texture: true
  shape_model: trellis2 #hunyuan #trellis2 #pixal3d #direct3d
  texture_model: trellis2 #hunyuan #trellis2 #pixal3d
  save_intermediates: true
  low_vram: true        # If true, enable CPU offloading to reduce GPU VRAM (~29GB -> ~6GB for shape gen)
  object_indices: null   # null = process all, or set [3, 7] to process specific objects
stage_review:
  mode: upsample   # options: depth, upsample, mesh
stream_subseq:
  start_stage: 5        # start stage in contiguous subsequence (5-8)
  end_stage: 8          # end stage in contiguous subsequence (5-8)
  poll_interval_s: 3.0
  idle_timeout_s: 120.0
  s5_cmd: "python scripts/pipeline/A_reconstruction/stages/5_decompose_scene.py"
  s6_cmd: "python scripts/pipeline/A_reconstruction/stages/6_upsample_object_images.py"
  s7_cmd: "python scripts/pipeline/A_reconstruction/stages/7_generate_object_meshes.py"
  s8_cmd: "python scripts/pipeline/A_reconstruction/stages/8_match_object_poses.py"
s8_pose:          # env: simfoundry
  rerun: true
  out_dirname: s8_pose
  out_dir: "${root_dir}/${scene_name}/${s8_pose.out_dirname}"
  source_voxel_scale_factor: 0.25
  voxel_size: 0.04
  n_samples: 20
  use_foundationpose: true # true # false
  est_refine_iter: 5  # Number of refinement iterations for FoundationPose
  object_indices: null  # null = all, or [1,2] for selective streaming/reruns
  use_any6d: true
s9_articulate_objects:
  rerun: true
  out_dirname: s9_articulate_objects
  out_dir: "${root_dir}/${scene_name}/${s9_articulate_objects.out_dirname}"
  vlm_model: gemini-2.5-pro
  method: hunyuan # or partfield
  # Classification review options:
  interactive_review: true           # If true, prompt user to review/modify VLM classification
  force_articulated: []               # List of object names to force as articulated (overrides VLM)
  force_non_articulated: ["white robotic arm", 'white and black robotic arm', 'small black electronic component', 'blue cup', 'small metallic sensor', 'purple cable']           # List of object names to force as non-articulated (overrides VLM)
s10_compile:      # env: simfoundry
  rerun: true
  out_dirname: s10_compile
  out_dir: "${root_dir}/${scene_name}/${s10_compile.out_dirname}"
s11_sim:          # env: simfoundry
  rerun: true
  out_dirname: s11_sim
  out_dir: "${root_dir}/${scene_name}/${s11_sim.out_dirname}"
  hull_count: 32
  n_submesh: 10
  vlm_model: gemini-2.5-pro
s12_physics:      # env: simfoundry
  rerun: true
  out_dirname: s12_physics
  out_dir: "${root_dir}/${scene_name}/${s12_physics.out_dirname}"
s13_usd: #env b1k
  rerun: true
  out_dirname: s13_usd
  out_dir: "${root_dir}/${scene_name}/${s13_usd.out_dirname}"
s14_og:
  rerun: true
  out_dirname: s14_og
  out_dir: "${root_dir}/${scene_name}/${s14_og.out_dirname}"
  robot_config:
    type: FrankaPanda
    end_effector: robotiq 
    name: robot0
    self_collisions: false
    obs_modalities: [rgb, depth_linear, proprio]
    action_normalize: false
    grasping_mode: assisted
    position: [-1.0, 0.0, 0.0]
    orientation: [0, 0, 0, 1]
  include_table: false
  include_robot: false
  include_gs: false
  randomize_xy_range: 0.01
  randomize_z_rotation_deg: 50           # Z-axis rotation range: 360 = full [0,360°), else ±N degrees (e.g. 30 = ±30°)
  randomize_settle_steps: 20
  auto_generation: true
  auto_iter_num: 10
  auto_camera_pos: [-0.0466, -0.7612, 0.5355]
  auto_camera_ori: [0.5219, -0.0213, -0.0347, 0.8521]
  auto_calibration_trials: 2
  auto_calibration_perturbation: 0.001
  check_touching: false                     # If true, validate touching relationships in auto_generation; if false, only on_top is checked
  external_sensors_cfg: nv_franka_droid    # Located in <CFG_DIR>/external_sensors
s14_teleop:
  rerun: true
  task_name: ${task.task_name}                  # Task YAML name (use task=load_scene then task.task_name=serve_the_orange for scene-specific task)
  scene_json_name: null                            # Name of scene JSON to load (located in SIMFOUNDRY_ASSET_DIR/scenes, without json extension) (null = use s14_og output)
  scene_source: reconstructed  # default is reconstructed, use auto_generation if you want to use auto-generated scenes                  # "reconstructed" | "auto_generation" (only when scene_json_name is null)
  auto_generation_scene_index: 0                   # Which auto-generated scene to load (0, 1, ...) when scene_source=auto_generation; files are s14_og/auto_generation/scene_000.json etc.
  use_floor_plane: true
  floor_plane_visible: false
  out_dirname: s14_teleop
  out_dir: "${root_dir}/${scene_name}/${s14_teleop.out_dirname}"
  instance_id: 0
  external_sensors_cfg: sim_franka_teleop     # Located in <CFG_DIR>/external_sensors
  max_steps: 500
  action_freq: 15
  arm_speed_scaledown: 0.04                   # Scaling factor for EEF control of robot using spacemouse
  arm_rot_speed_scaledown: [0.08, 0.08, 0.16]               # Scaling factor for EEF rotation control of robot using spacemouse
  device: spacemouse          #  [keyboard, spacemouse, oculus]
  save_data: true
  object_swap_json: null                  # Path to JSON mapping object names to replacement USD paths (e.g., assets/cousins/StackDishware/swap.json). See assets/cousins/ for example cousin USDs.
  highlight_objects: true                 # If true, tint all non-robot/non-background objects light green for teleop visibility
  hide_robot_body: true                   # If true, hide robot arm links (gripper/EEF links remain visible)
  use_deterministic_pose_schedule: true   # If true, pre-compute N deterministic z-rotation configs and collect exactly 1 success per config
  n_deterministic_samples: 8              # Number of evenly-spaced z-rotation configurations to sample
  data_env_kwargs:
    # Prim path for the camera used when recording viewport during teleop. Options:
    # - .../external_cam0          (robot-mounted, one side)
    # - .../external_cam0_opposite (robot-mounted, opposite; matches sim_franka_teleop sensor)
    # - /World/viewer_camera       (default free viewer camera)
    viewport_camera_path: /World/scene_0/controllable__frankapanda__robot0/panda_link0/external_cam0_opposite
    overwrite: true       # shouldn't make a difference because every dataset is written to unique timestamp
    only_successes: true
    obj_attr_keys: [scale, visible]
    flush_every_n_traj: 10


s15_eval:       # env: b1k -- Evaluate Gr00t checkpoint on OmniGibson scene
  rerun: true
  
  out_dirname: s15_eval
  checkpoint: n17_cs_er2 # TODO: get this from policy metadata later
  host: "localhost"
  # policy : openpi # [openpi, gr00t]
  # port: 8000 # 8000 for OpenPI, 5555 for Gr00t
  policy : gr00t # [openpi, gr00t]
  port: 5555 # 8000 for OpenPI, 5555 for Gr00t
  # port: 5555 # 8000 for OpenPI, 5555 for Gr00t
  # port: 5555 # 8000 for OpenPI, 5555 for Gr00t
  out_dir: "${root_dir}/${scene_name}/${s15_eval.out_dirname}/${s15_eval.policy}"
  asset_id: franka                        # Normalization stats ID: 'franka' (joint pos) or 'droid' (joint vel)
  scene_json: droid_desk_serve_fruits                # Path to scene JSON (null = use s14_og output)
  grasping_mode: assisted # physical # assisted
  use_floor_plane: true
  floor_plane_visible: false
  external_sensors_cfg: nv_franka_droid   # Located in <CFG_DIR>/external_sensors
  action_freq: 15                         # Action frequency in Hz
  timeout_s: 120                            # Maximum episode timeout in seconds
  execute_horizon: 24                     # Number of actions to execute per policy inference
  n_episodes: 20                          # Number of evaluation episodes
  init_states_path: path/to/Data/init_states/serve_fruits/init_states.json                  # Optional path to init_states.json for deterministic evals
  prompt: "put both the banana and the apple on the green plate" 
  # prompt: "open the trash can, pick up the cup, put the cup into the trash can, and then close the trash can"            # Language prompt for the policy
  base_camera_1_name: external_cam0_left  # Name of the first external camera (DROID exterior_image_1)
  base_camera_2_name: external_cam1_left  # Name of the second external camera (DROID exterior_image_2)
  interactive: false                      # If true, drops into IPython for interactive evaluation
  save_video: true                        # If true, saves video of policy observations per episode
  video_fps: 10                             # FPS for saved videos
s15_annotate:     # env: b1k
  rerun: true
  out_dirname: s15_annotation
  out_dir: "${root_dir}/${scene_name}/${s15_annotate.out_dirname}"
  robot_id: 0
  check_gripper_open_during_place: true
  filter: null                            # If set, processes ALL HDF5 files from s14 matching this substring (e.g. "cousin")
s16_waypoints:     # env: b1k
  rerun: true
  out_dirname: s16_waypoints
  out_dir: "${root_dir}/${scene_name}/${s16_waypoints.out_dirname}"

  # EEF pose adjustment
  eef_z_offset: 0.0               # Z offset in local EEF frame to apply when tracking EEF pose (meters)

  # Distance-based extraction (PRIMARY - must satisfy)
  pick_min_start_distance: 0.15     # EEF must start at least this far from object (meters)
  pick_max_distance: 0.30          # Stop when EEF exceeds this distance from object
  place_min_start_distance: 0.15    # EEF must start at least this far from target surface
  place_max_distance: 0.30         # Stop when EEF exceeds this distance from target
  open_min_start_distance: 0.09     # EEF must start at least this far from articulated object (meters)
  open_max_distance: 0.50          # Stop when EEF exceeds this distance from articulated object
  close_min_start_distance: 0.09    # EEF must start at least this far from articulated object (meters)
  close_max_distance: 0.50         # Stop when EEF exceeds this distance from articulated object
  end_z_threshold: 0.05            # Stop when distance exceeds this (euclidean from signal EEF for pick/place, relative vertical to link for open/close, meters)
  merge_sequences: true            # If true, merge adjacent subtask sequences sharing the same reference object frame (skips freespace interpolation between them)
  use_open_grasp_signal: true     # If true, for "open" signals, verify gripper is closed and use gripper release + L2 distance as stopping condition
  open_grasp_max_distance: 0.15   # L2 distance threshold from EEF at gripper release (meters, only used when use_open_grasp_signal=true)
  filter: null                    # If set, processes ALL annotation/HDF5 pairs from s15/s14 matching this substring
s17_generate:     # env: b1k
  rerun: true
  out_dirname: s17_generated_demos
  out_dir: "${root_dir}/${scene_name}/${s17_generate.out_dirname}"
  action_frequency: 15      # Action frequency in Hz
  n_demos: 5                # Number of successful demos to generate
  max_attempts: 10          # Maximum generation attempts
  use_curobo: false         # If true, use CuRobo motion planning; if false, use linear interpolation
  curobo_max_attempts: 10   # CuRobo motion planning max attempts
  curobo_timeout: 60.0      # CuRobo planning timeout in seconds
  freespace_velocity: 0.1   # Target end-effector velocity for freespace motion (m/s), used when use_curobo=false
  smooth_freespace: false   # If true, use spline-based freespace interpolation with velocity profiling for smooth transitions
  smooth_n_boundary_waypoints: 5      # Number of waypoints sampled from each adjacent segment boundary for direction/velocity estimation
  smooth_velocity_ramp_fraction: 0.25 # Fraction of spline arc length used for velocity ramp at each end (0.25 = first 25% ramps up, last 25% ramps down)
  smooth_spline_tangent_scale: 1.0    # Multiplier for cubic Hermite tangent magnitudes; larger values produce wider curves, smaller values approach a straight line
  smooth_spline_samples: 1000         # Internal resolution for spline arc-length computation (higher = more accurate but slower)
  inverted_gripper: false   # If true, invert the gripper action (0.0 = open, 1.0 = closed)
  eef_z_offset: "${s16_waypoints.eef_z_offset}"  # Z offset in local EEF frame (should match s16_waypoints.eef_z_offset)
  grasping_type: null       # If set, override robot grasping mode. Valid options: "physical", "assisted". Default null = no override
  max_joint_velocity: 0.2  # If set (rad/step), terminate episode if any arm joint exceeds this per-step position change. Detects degenerate shaking from collisions/singularities
  k_nearest_neighbors:      # Top-K nearest neighbors to sample from. Scalar, per-type dict, or list (one per subtask)
    # pick: 1
    # place: 1
    # open: 1
    # close: 1
  knn_pos_weight:           # Weight for position L2 distance in KNN selection. Scalar, per-type dict, or list (one per subtask)
    # pick: 0.5
    # place: 0.5
    # open: 0.5
    # close: 0.5
  knn_ori_weight:           # Weight for orientation angular distance in KNN selection. Scalar, per-type dict, or list (one per subtask)
    # pick: 2.0
    # place: 2.0
    # open: 2.0
    # close: 2.0
  blacklist_ids: null             # Optional list of lists: outer length = n_subtasks, inner lists = episode IDs to exclude from KNN selection per subtask
  action_noise:                   # TCP-bounded action noise for domain randomization
    enabled: true                 # Whether to apply action noise during data generation
    action_scale_factor: 0.1      # Arm noise std = scale * ||tcp_delta|| (10% of commanded TCP delta)
    rotation_noise_scale: 0.1     # Rotation noise scale relative to position noise
    max_tcp_position_noise: 0.02  # Maximum position noise in TCP space (meters)
    max_tcp_rotation_noise: 0.1   # Maximum rotation noise in TCP space (radians, ~5.7 degrees)
    apply_to_freespace: true      # Whether to apply noise during freespace motions (in addition to waypoint tracking)
  filter: null                    # If set, processes ALL waypoint/config pairs from s16/s15 matching this substring (n_demos and max_attempts apply per dataset)
s18_replay:          # env: b1k
  rerun: true
  out_dirname: s18_replay
  out_dir: "${root_dir}/${scene_name}/${s18_replay.out_dirname}"
  repo_prefix: "omnigibson"                    # Prefix for LeRobot dataset repo_id (e.g., "username")
  dataset_name: "${scene_name}_${task.task_name}"  # Name of the LeRobot dataset
  include_mimicgen_data: true                     # Either include mimicgen data generated in step 17 or not
  external_sensors_cfg: nv_franka_droid    # Located in <CFG_DIR>/external_sensors
  filter: null                                     # If set, processes ALL generated demo HDF5s from s17 (or s14) matching this substring (spawns subprocesses)
  modality_json: ../../simfoundry/configs/modality/droid_modality.json   # If set, path to a modality.json that replaces the auto-generated one in each output dataset
  depth_as_rgb: false                            # Whether depth should be saved in encoded RGB or not
  use_pointbridge: false                         # Whether to use LeRobotPointbridgePlaybackWrapper for point cloud generation
  pointbridge_kwargs:                            # Kwargs for LeRobotPointbridgePlaybackWrapper (only used if use_pointbridge=true)
    num_points_obj: 128                          # Number of points to sample for each object in point cloud
    num_objects: 1                               # Number of objects to sample in point cloud
    include_categories: null                     # Categories to include in point cloud (null = all categories)
    pc_x_min: -2.0                               # Min X workspace bound for point cloud (in robot frame)
    pc_x_max: 2.0                                # Max X workspace bound for point cloud (in robot frame)
    pc_y_min: -2.0                               # Min Y workspace bound for point cloud (in robot frame)
    pc_y_max: 2.0                                # Max Y workspace bound for point cloud (in robot frame)
    pc_z_min: -2.0                              # Min Z workspace bound for point cloud (in robot frame)
    pc_z_max: 2.0                                # Max Z workspace bound for point cloud (in robot frame)
    pointcloud_sensors: null                     # Sensors to generate point clouds from (null = all depth sensors)
  playback_kwargs:
    n_episodes: null                         # Number of episodes to replay
    robot_obs_modalities: [rgb, proprio]  # Robot observation modalities to collect
    robot_proprio_keys: [arm_0_qpos, arm_0_qvel, eef_0_pos, eef_0_quat, gripper_0_qpos, gripper_0_qpos_norm]                     # Optional list of proprioception keys to use
    robot_sensor_config:                         # Optional sensor configuration override
      VisionSensor:
        modalities: [rgb]
        sensor_kwargs:
          image_height: 180 #720
          image_width: 320 #1280
    external_sensors_config: null                # DO NOT MODIFY -- this is auto-loaded from @external_sensors_cfg
    include_sensor_names: null                   # Optional list of sensor name substrings to include
    exclude_sensor_names: null                   # Optional list of sensor name substrings to exclude
    n_render_iterations: 5                       # Number of rendering iterations per frame
    overwrite: true                              # Whether to overwrite existing dataset
    only_successes: true                         # Whether to only save successful episodes
    flush_every_n_traj: 10                       # How often to flush data to disk (across episodes)
    flush_every_n_steps: 0                       # How often to flush within episodes (0 = disabled)
    include_task: true                           # Whether to include the original task
    include_task_obs: true                       # Whether to include task observations
    include_robot_control: true                  # Whether to enable robot control during playback
    include_contacts: true                       # Whether to enable contacts (physics) during playback
    include_env_wrapper: false                   # Whether to include environment wrapper class during instantiation
    robot_type: null                             # Robot type name (null = auto-infer from env)
    image_writer_threads: 10                     # Number of threads for writing images
    image_writer_processes: 5                    # Number of processes for writing images
    task_name: null                              # Task name (null = auto-infer from task)
    lerobot_version: "v2.1"                      # LeRobot version (v2.1 or v3.0)
    use_videos: true                            # Whether to use videos or not
    include_multi_action_representation: false    # Whether to include multi action representation in the dataset
    include_modalities: [rgb, proprio]                      # Modalities to include in the dataset
  # Data transformations (applied during saving only, not during env execution)
  invert_gripper_action: true                    # If true, invert gripper action: action[-1] = 1 - action[-1]
  scale_gripper_state: 1.0                       # Factor to multiply gripper state (observation.state[-1]) by
  # Domain randomization (visual augmentation during replay)
  domain_randomization:
    enabled: true                               # Master switch for all domain randomization
    randomize_interval_steps: 30                  # Steps between randomization updates (0 = only at episode start)
    materials:
      enabled: true                             # Enable material/texture randomization
      object_names: null                           # Object names to randomize (e.g., [obj_0, obj_1]). None defaults to all included, except robots / background
      randomize_robot: false                     # Whether to also randomize robot materials
      material_preset: default_train                      # Preset name: "default_train", "default_eval", or null for library discovery
      categories: null                           # Material categories to use (null = all). e.g., [Wood, Metals, Plastics]
      num_variants_per_material: 3               # Randomized variant copies per material (null = one per natural variant)
      include_wood: true                         # Include curated wood materials
      include_metal: true                        # Include curated metal materials
      include_plastic: true                      # Include curated plastic materials
      include_paint: true                        # Include curated paint/textile materials
    lighting:
      enabled: true                             # Enable lighting randomization
      dome_intensity_range: [300.0, 1200.0]      # Min/max dome light intensity
      dome_color_temperature_range: [4000.0, 8000.0]  # Min/max color temperature in Kelvin
      use_hdri_textures: true                   # Use HDRI textures for environment lighting
      randomize_hdri_rotation: true              # Randomly rotate the HDRI environment
      hdri_rotation_range: [0.0, 360.0]          # Min/max HDRI rotation in degrees
    camera_pose:
      enabled: true                             # Enable camera pose randomization
      position_noise_std: 0.05                  # Std dev of Gaussian noise added to camera position (meters)
      orientation_noise_std: 10.0               # Std dev of Gaussian noise added to camera orientation (degrees)
s19_cousin_generation:          # env: mesh
  out_dirname: s16_cousin_generation
  source_dir: "${root_dir}/${scene_name}/cousin_images"
  out_dir: "${root_dir}/${scene_name}/${s19_cousin_generation.out_dirname}"
  generate_shape: false
  generate_texture: true
  shape_model: hunyuan #direct3d
  texture_model: hunyuan
s15_prompt_cousin_structured:      # env: simfoundry
  out_dirname: s15_prompt_cousin_structured
  out_dir: "${root_dir}/${scene_name}/${s15_prompt_cousin_structured.out_dirname}"
  num_geometry_variation: 3
  num_topology_variation: 3
  num_visual_variation: 3
  check_reasonableness: true
  # sam_conf_threshold: 0.1
s16_cousin_generation:    # env: mesh
  source_dir: "${root_dir}/${scene_name}/s16_cousin_generation/source_img"
  out_dir: "${root_dir}/${scene_name}/s16_cousin_generation"
  generate_shape: true
  generate_texture: true
  shape_model: hunyuan #direct3d
  texture_model: hunyuan
  keep_original_mass_friction: true  # If true, copy mass/friction from original source object instead of querying VLM
generate_cousins_combination: # env: simfoundry
  source_dir: "${root_dir}/${scene_name}/${s15_prompt_cousin_structured.out_dirname}"
  out_dirname: cousins_combination
  out_dir: "${root_dir}/${scene_name}/${generate_cousins_combination.out_dirname}"
  seed: 42
  num_obj_to_swap: 3
  num_variations_used_per_object: 2

s2c_gs:  # env: nerfstudio_simfoundry; process video with ns-process-data and train splatfacto-big
  out_dirname: s2c_gs
  out_dir: "${root_dir}/${scene_name}/${s2c_gs.out_dirname}"
  video_fpath: "${root_dir}/Scene_Video/${scene_name}.MOV"
  processed_dirname: processed
  export_dirname: export
  num_frames_target: 1000  # frames to extract (nerfstudio default 300); more = denser, slower COLMAP
  matching_method: vocab_tree  # sequential often registers only a few frames; vocab_tree gets many more poses
  max_num_iterations: 50000
  method: splatfacto-big

propose_scene_task:   # env: simfoundry -- Propose tasks for a scene using VLM
  rerun: true
  num_tasks: 3                                    # Number of tasks to propose
  vlm_model: gemini-3-pro-preview                 # VLM model to use
  scene_image_idx: null                           # null = use s14_og/reconstructed_scene.png (from 14_create_og_scene); set to "000", "001" etc. to use s14_og/auto_generation/scene_XXX.png (from B stage 6 auto-generation)
  out_dir: "${cfg_dir}/task/${scene_name}"        # Output directory for proposed task YAMLs
  robot_type: franka                              # Robot type: franka, franka_robotiq, yam (affects prompt constraint)
  robot_constraint: null                          # Custom robot constraint string (null = auto from robot_type)
  include_any: [yellow_banana, white_plate]                                 # Object names (iter_0) or categories (banana); each must appear in ≥1 task
  include_all: [iter_5]                                 # Object names or categories; must appear in every task's goal_predicates
  exclude_all: [wooden_ruler, orange_scissors]                                 # Object names or categories; must not appear in any proposed task
# ----------------------------

prefix:
suffix:
postsuffix:

hydra:
  job:
    chdir: true
  run:
    dir: "."
  output_subdir: null
