name: sceneagent-ci

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m compileall -q sceneagent
      - name: Install CPU test dependencies
        run: python -m pip install numpy pytest trimesh pillow
      - name: Phase-1 unit tests
        run: python -m pytest tests/sceneagent -q
